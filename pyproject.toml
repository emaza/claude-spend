[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-spend"
dynamic = ["version"]
description = "Visualize Claude Code token usage in simple tables, in an interactive terminal view or a local web page, broken down by agent, project, model, day, session and task"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["claude", "claude-code", "tokens", "usage", "cost"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
# No third-party dependencies: standard library only.
dependencies = []

[project.urls]
Homepage = "https://github.com/emaza/claude-spend"
Issues = "https://github.com/emaza/claude-spend/issues"

[project.scripts]
claude-spend = "claude_spend.tracker:main"

[tool.setuptools]
packages = ["claude_spend"]

[tool.setuptools.dynamic]
version = { attr = "claude_spend.tracker.__version__" }

[tool.setuptools.package-data]
claude_spend = ["prices.json", "web/*"]
